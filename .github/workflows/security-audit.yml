# Security Audit - Simplified for development

name: "Security Audit"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  npm-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Block moderate or higher runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=moderate

      - name: Block moderate or higher dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Check package versions
        run: npm outdated || true
