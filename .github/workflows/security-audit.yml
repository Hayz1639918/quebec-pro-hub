# Security Audit Workflow - BâtirNet
# Runs npm audit and generates SBOM
# Reference: NIST SSDF SP 800-218

name: "Security Audit & SBOM"

on:
  push:
    branches: [ "main", "develop", "claude/*" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    # Run every day at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  npm-audit:
    name: npm Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        run: |
          npm audit --audit-level=moderate --json > audit-results.json || true
          npm audit --audit-level=moderate

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30

      - name: Check for critical/high vulnerabilities
        run: |
          CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' audit-results.json)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' audit-results.json)

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "::error::Found $CRITICAL critical and $HIGH high severity vulnerabilities"
            exit 1
          fi

  generate-sbom:
    name: Generate SBOM (Software Bill of Materials)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

      - name: SBOM Summary
        run: |
          echo "### 📦 SBOM Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "CycloneDX SBOM generated successfully." >> $GITHUB_STEP_SUMMARY
          echo "Components: $(jq -r '.components | length' sbom.json)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact to view full SBOM." >> $GITHUB_STEP_SUMMARY

  depcheck:
    name: Check Unused Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run depcheck
        id: depcheck
        run: |
          npx depcheck --json > depcheck-results.json || true
          cat depcheck-results.json | jq '.'

      - name: Upload depcheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depcheck-results
          path: depcheck-results.json
          retention-days: 30

      - name: Analyze unused dependencies
        run: |
          UNUSED_DEPS=$(jq -r '.dependencies | length' depcheck-results.json)
          UNUSED_DEV=$(jq -r '.devDependencies | length' depcheck-results.json)

          echo "### 🔍 Dependency Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Unused dependencies: $UNUSED_DEPS" >> $GITHUB_STEP_SUMMARY
          echo "- Unused devDependencies: $UNUSED_DEV" >> $GITHUB_STEP_SUMMARY

          if [ "$UNUSED_DEPS" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Unused production dependencies:**" >> $GITHUB_STEP_SUMMARY
            jq -r '.dependencies[]' depcheck-results.json | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY || true
          fi
