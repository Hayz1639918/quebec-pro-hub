# Dependency Review - BâtirNet
# Scans pull requests for vulnerable dependencies
# Reference: https://docs.github.com/code-security/supply-chain-security/

name: "Dependency Review"

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail the action if vulnerabilities are found
          fail-on-severity: moderate
          # Allow licenses (SPDX identifiers)
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD
          # Deny licenses
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # Comment on PR with results
          comment-summary-in-pr: always
