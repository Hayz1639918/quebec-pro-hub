# Test & Code Quality - BâtirNet
# Simplified version for development

name: "Test & Quality"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter (if available)
        run: npm run lint || echo "Linter not configured, skipping"
        continue-on-error: true

      - name: Run type check (if available)
        run: npm run type-check || echo "Type check not configured, skipping"
        continue-on-error: true

      - name: Run tests (if available)
        run: npm run test || echo "Tests not configured yet"
        continue-on-error: true

      - name: Build check
        run: npm run build
