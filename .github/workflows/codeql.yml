# CodeQL Security Scanning - BâtirNet
# Analyzes code for security vulnerabilities and coding errors
# Reference: https://docs.github.com/code-security/code-scanning/

name: "CodeQL Security Analysis"

on:
  push:
    branches: [ "main", "develop", "claude/*" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze Code Security
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      # Required for CodeQL scanning
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL supports: 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift'
        language: [ 'javascript', 'typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Customize queries (optional)
        # queries: security-extended,security-and-quality
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"

    - name: Upload SARIF results
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ../results/${{ matrix.language }}.sarif
