<!doctype html>
<html lang="fr">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Viewport optimisé pour mobile avec support safe-area (notch iPhone) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />
    <!-- Empêche le zoom automatique sur iOS quand on focus un input -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Thème de la barre d'adresse mobile -->
    <meta name="theme-color" content="#0D2B45" />
    <!-- Fonts: Instrument Serif (display) + Source Serif 4 (body) + DM Mono (mono) + Outfit (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,300;1,8..60,400;1,8..60,500&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Apple Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BâtirNet" />

    <meta name="keywords" content="entrepreneurs, construction, rénovation, bâtiment, Québec, Canada, RBQ, contrats, paiements sécurisés" />

    <meta property="og:title" content="BâtirNet - Plateforme canadienne pour entrepreneurs du bâtiment" />
    <meta property="og:description" content="Trouvez les meilleurs entrepreneurs qualifiés pour vos projets de construction et rénovation. Sécurisé, transparent, professionnel." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BâtirNet" />
    <meta property="og:url" content="https://batirnet.com/" />
    <meta property="og:image" content="https://batirnet.com/logo-batirnet.png" />
    <meta property="og:image:alt" content="Logo BâtirNet" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BâtirNet - Plateforme canadienne pour entrepreneurs du bâtiment" />

        "@context": "https://schema.org",
